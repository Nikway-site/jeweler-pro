<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ته‌حساب لایت</title>
<style>
body{margin:0;background:#f4f6f8;color:#17202a;font-family:Tahoma,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#102a2a;color:#d9f3ef;padding:24px 16px}.brand{font-size:22px;font-weight:bold;margin-bottom:28px}.brand small{display:block;font-size:11px;color:#9ad5ca;margin-top:6px}.nav button{display:block;width:100%;text-align:right;background:transparent;color:#c9e7e2;border:0;padding:12px;border-radius:9px;margin:4px 0;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{background:#1b4b49;color:#fff}.main{flex:1;padding:28px;max-width:1300px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0}.pill{background:#d9f3ef;color:#115e59;padding:8px 12px;border-radius:99px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:18px;box-shadow:0 4px 16px #102a2a0a}.metric{font-size:24px;font-weight:bold;margin-top:12px}.muted{color:#718096;font-size:13px}.panel{margin-top:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h2{font-size:17px;margin:0}.btn{background:#0f766e;color:#fff;padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font:inherit}.btn.secondary{background:#edf7f5;color:#115e59}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #e5e7eb;text-align:right;font-size:13px}.table th{color:#718096;font-weight:normal}.empty{text-align:center;padding:30px;color:#718096}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.form label{font-size:12px;color:#718096}.form input{display:block;width:100%;margin-top:5px;padding:9px;border:1px solid #e5e7eb;border-radius:7px}.hidden{display:none}@media(max-width:800px){.side{width:180px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{display:block}.side{width:auto}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style>
<div class="app"><aside class="side"><div class="brand">ته‌حساب لایت<small>حسابداری طلا و جواهر</small></div><nav class="nav"><button class="active" data-p="dashboard">◈ داشبورد</button><button data-p="products">◇ کالا و موجودی</button><button data-p="contacts">◎ اشخاص</button><button data-p="sales">▣ فروش</button><button data-p="purchases">▤ خرید</button><button data-p="reports">▥ گزارش‌ها</button><button data-p="settings">⚙ تنظیمات</button></nav></aside><main class="main"><div class="top"><h1 id="title">داشبورد</h1><span class="pill">ذخیره‌سازی محلی</span></div><section id="content"></section></main></div>
<script>
const K='tahesab-lite-v1';let db=JSON.parse(localStorage.getItem(K)||'{"products":[],"contacts":[],"sales":[],"purchases":[]}');const save=()=>localStorage.setItem(K,JSON.stringify(db));const money=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0))+' تومان';const C=document.querySelector('#content'),T=document.querySelector('#title');
function dashboard(){let st=db.products.reduce((a,x)=>a+Number(x.stock||0),0),sa=db.sales.reduce((a,x)=>a+Number(x.amount||0),0);C.innerHTML='<div class="grid"><div class="card"><span class="muted">فروش ثبت‌شده</span><div class="metric">'+money(sa)+'</div></div><div class="card"><span class="muted">کالاها</span><div class="metric">'+db.products.length+'</div></div><div class="card"><span class="muted">موجودی</span><div class="metric">'+st+'</div></div><div class="card"><span class="muted">طرف‌حساب‌ها</span><div class="metric">'+db.contacts.length+'</div></div></div><div class="panel"><div class="panel-head"><h2>شروع سریع</h2><button class="btn" onclick="page(\'products\')">تعریف کالا</button></div><p class="muted">اطلاعات این نمونه فقط روی همین دستگاه ذخیره می‌شود.</p></div>'}
function list(type,label,fields){let rows=db[type];C.innerHTML='<div class="panel"><div class="panel-head"><h2>'+label+'</h2><button class="btn" id="add">+ ثبت مورد جدید</button></div><div id="form" class="hidden"></div>'+(rows.length?'<table class="table"><tr>'+fields.map(f=>'<th>'+f.l+'</th>').join('')+'<th>عملیات</th></tr>'+rows.map((r,i)=>'<tr>'+fields.map(f=>'<td>'+(f.m?money(r[f.k]):(r[f.k]||'—'))+'</td>').join('')+'<td><button class="btn" data-del="'+i+'">حذف</button></td></tr>').join('')+'</table>':'<div class="empty">هنوز موردی ثبت نشده است.</div>')+'</div>';document.querySelector('#add').onclick=()=>form(type,fields);document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('این مورد حذف شود؟')){db[type].splice(Number(b.dataset.del),1);save();page(type)}})}
function form(type,fields){let e=document.querySelector('#form');e.className='form';e.innerHTML=fields.filter(f=>f.k!=='date').map(f=>'<label>'+f.l+' *<input id="i-'+f.k+'" type="'+(f.m?'number':'text')+'" min="0"></label>').join('')+'<button class="btn" id="save">ذخیره</button>';document.querySelector('#save').onclick=()=>{let r={date:new Date().toISOString()};for(const f of fields.filter(f=>f.k!=='date')){const el=document.querySelector('#i-'+f.k);if(!el.value.trim()){el.focus();alert('لطفاً '+f.l+' را وارد کنید.');return}r[f.k]=f.m?Math.max(0,Number(el.value)):el.value.trim()}db[type].push(r);save();page(type)}}
function reports(){C.innerHTML='<div class="panel"><div class="panel-head"><h2>گزارش‌ها</h2><div><button class="btn secondary" onclick="backup()">پشتیبان‌گیری</button><button class="btn secondary" onclick="restore()">بازیابی</button></div></div><table class="table"><tr><th>گزارش</th><th>مقدار</th></tr><tr><td>موجودی کالا</td><td>'+db.products.reduce((a,x)=>a+Number(x.stock||0),0)+'</td></tr><tr><td>فروش ثبت‌شده</td><td>'+money(db.sales.reduce((a,x)=>a+Number(x.amount||0),0))+'</td></tr><tr><td>خرید ثبت‌شده</td><td>'+money(db.purchases.reduce((a,x)=>a+Number(x.amount||0),0))+'</td></tr></table></div>'}function restore(){let i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.contacts||!x.sales||!x.purchases)throw Error();db=x;save();page('reports');alert('بازیابی با موفقیت انجام شد.')}catch{alert('فایل پشتیبان معتبر نیست.')}};r.readAsText(i.files[0])};i.click()}function settings(){C.innerHTML='<div class="panel"><h2>تنظیمات</h2><p class="muted">اطلاعات در localStorage مرورگر ذخیره می‌شود.</p><button class="btn" onclick="backup();setTimeout(()=>{if(confirm(\'اطلاعات حذف شود؟\')){db={products:[],contacts:[],sales:[],purchases:[]};save();page(\'dashboard\')}},100)">پشتیبان‌گیری و پاک‌کردن اطلاعات</button></div>'}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='tahesab-lite-backup.json';a.click()}
function page(p){let names={dashboard:'داشبورد',products:'کالا و موجودی',contacts:'اشخاص و طرف‌حساب‌ها',sales:'فروش',purchases:'خرید',reports:'گزارش‌ها',settings:'تنظیمات'};T.textContent=names[p];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));if(p==='dashboard')dashboard();if(p==='products')list('products','کالاها',[{k:'name',l:'نام کالا'},{k:'code',l:'کد کالا'},{k:'stock',l:'موجودی'},{k:'unit',l:'واحد'}]);if(p==='contacts')list('contacts','طرف‌حساب‌ها',[{k:'name',l:'نام'},{k:'mobile',l:'موبایل'},{k:'type',l:'نوع'}]);if(p==='sales')list('sales','فروش‌ها',[{k:'date',l:'تاریخ'},{k:'customer',l:'مشتری'},{k:'amount',l:'مبلغ',m:1}]);if(p==='purchases')list('purchases','خریدها',[{k:'date',l:'تاریخ'},{k:'supplier',l:'تأمین‌کننده'},{k:'amount',l:'مبلغ',m:1}]);if(p==='reports')reports();if(p==='settings')settings()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.p));page('dashboard');
</script>
