name: Bahar STAR Iran gold accounts synthetic
on:
  pull_request:
    paths:
      - 'backend/baharstar-iran/**'
      - 'backend/tests/baharstar-iran-gold-accounts.test.js'
      - '.github/workflows/baharstar-iran-gold-accounts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/tests/baharstar-iran-gold-accounts.test.js
